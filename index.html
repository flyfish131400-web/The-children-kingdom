<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>The Children Kingdom</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07111b;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  border:0;
  font:inherit;
}

/* ============================= */
/* GAME */
/* ============================= */

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* ============================= */
/* CITY BACKGROUND */
/* ============================= */

#city{
  position:absolute;
  inset:0;

  background-image:url("assets/city-bg.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

/* subtle HUD readability */

#city::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
  linear-gradient(
    to bottom,
    rgba(3,12,20,.45) 0%,
    rgba(3,12,20,.05) 20%,
    rgba(3,12,20,0) 70%,
    rgba(3,12,20,.38) 100%
  );
}

/* ============================= */
/* TOP PLAYER PANEL */
/* ============================= */

#topHUD{
  position:absolute;

  top:max(10px,env(safe-area-inset-top));
  left:12px;
  right:12px;

  display:flex;
  align-items:flex-start;
  gap:8px;

  z-index:30;
}

#playerPanel{
  display:flex;
  align-items:center;

  min-width:265px;

  height:78px;

  padding:6px 14px 6px 7px;

  border:2px solid #e1bd6b;
  border-radius:18px;

  background:
  linear-gradient(
    180deg,
    rgba(24,52,76,.96),
    rgba(8,25,42,.96)
  );

  box-shadow:
  0 5px 15px rgba(0,0,0,.5),
  inset 0 1px rgba(255,255,255,.15);
}

#avatarFrame{
  position:relative;

  width:62px;
  height:62px;

  overflow:hidden;

  border-radius:13px;

  border:2px solid #d8b865;

  background:#243b50;
}

#avatarFrame img{
  width:100%;
  height:100%;
  object-fit:cover;
}

#playerInfo{
  margin-left:11px;
}

#kingdomName{
  color:white;
  font-weight:900;
  font-size:18px;

  text-shadow:
  0 2px 3px rgba(0,0,0,.8);
}

#kingdomStats{
  margin-top:7px;

  display:flex;
  gap:9px;

  color:#ffdc72;

  font-weight:800;
  font-size:13px;
}

.levelBadge{
  padding:3px 8px;

  background:
  linear-gradient(#e2a72f,#905a12);

  color:white;

  border-radius:7px;

  border:1px solid #ffd373;
}

/* ============================= */
/* RESOURCES */
/* ============================= */

#resources{
  display:flex;
  gap:6px;

  flex:1;

  justify-content:center;
}

.resource{
  min-width:117px;
  height:48px;

  padding:5px 12px 5px 8px;

  display:flex;
  align-items:center;

  gap:8px;

  border-radius:16px;

  background:
  linear-gradient(
    180deg,
    rgba(28,50,68,.95),
    rgba(9,24,38,.96)
  );

  border:1px solid rgba(222,194,123,.55);

  color:white;

  box-shadow:0 4px 12px rgba(0,0,0,.35);
}

.resource img{
  width:31px;
  height:31px;
  object-fit:contain;
}

.resourceValue{
  font-size:16px;
  font-weight:900;

  text-shadow:
  0 2px 2px rgba(0,0,0,.65);
}

/* ============================= */
/* HOTSPOTS */
/* ============================= */

/*
These buttons are invisible.

They sit on top of the real artwork.

Later we adjust their positions
exactly to match city-bg.jpg.
*/

.hotspot{
  position:absolute;
  z-index:15;

  background:rgba(0,0,0,0);

  cursor:pointer;
}

/* castle */

#castleHotspot{
  left:34%;
  top:22%;
  width:29%;
  height:39%;
}

/* barracks */

#barracksHotspot{
  left:18%;
  top:18%;
  width:19%;
  height:18%;
}

/* farm */

#farmHotspot{
  left:57%;
  top:33%;
  width:17%;
  height:17%;
}

/* mine */

#mineHotspot{
  left:53%;
  top:15%;
  width:16%;
  height:17%;
}

/* sawmill */

#sawmillHotspot{
  left:66%;
  top:33%;
  width:19%;
  height:20%;
}

/* academy */

#academyHotspot{
  left:31%;
  top:48%;
  width:20%;
  height:19%;
}

/* hospital */

#hospitalHotspot{
  left:15%;
  top:52%;
  width:20%;
  height:19%;
}

/* shipyard */

#shipyardHotspot{
  left:61%;
  top:55%;
  width:29%;
  height:31%;
}

/* ============================= */
/* BOTTOM HUD */
/* ============================= */

#bottomHUD{
  position:absolute;

  left:12px;
  right:12px;

  bottom:max(12px,env(safe-area-inset-bottom));

  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  z-index:30;
}

.bottomGroup{
  display:flex;
  gap:8px;
}

.hudButton{
  width:78px;
  height:78px;

  border-radius:18px;

  overflow:hidden;

  background:
  linear-gradient(
    #2d4f68,
    #112739
  );

  border:2px solid #d8b663;

  box-shadow:
  0 5px 14px rgba(0,0,0,.55);
}

.hudButton img{
  width:100%;
  height:100%;
  object-fit:cover;
}

#attackButton{
  width:98px;
  height:98px;

  border-radius:50%;

  overflow:hidden;

  border:3px solid #e3c06d;

  background:#19354a;

  box-shadow:
  0 7px 18px rgba(0,0,0,.6);
}

#attackButton img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ============================= */
/* BUILDING PANEL */
/* ============================= */

#panelOverlay{
  position:absolute;
  inset:0;

  display:none;

  background:rgba(3,11,19,.55);

  z-index:60;
}

#panelOverlay.show{
  display:block;
}

#panel{
  position:absolute;

  left:50%;
  bottom:-650px;

  transform:translateX(-50%);

  width:min(600px,94vw);

  border-radius:25px 25px 0 0;

  border:2px solid #c5a25e;

  overflow:hidden;

  background:
  linear-gradient(
    #fff9e7,
    #e8d7af
  );

  box-shadow:
  0 -18px 50px rgba(0,0,0,.55);

  transition:.32s ease;

  z-index:70;
}

#panel.show{
  bottom:0;
}

#panelHeader{
  min-height:64px;

  padding:14px 58px 12px 19px;

  background:
  linear-gradient(
    #304f67,
    #162e41
  );

  color:white;

  border-bottom:2px solid #c5a25e;
}

#panelTitle{
  font-size:22px;
  font-weight:900;
}

#panelSubtitle{
  margin-top:3px;

  font-size:12px;
  color:#dce8ef;
}

#closePanel{
  position:absolute;

  right:14px;
  top:14px;

  width:36px;
  height:36px;

  border-radius:50%;

  color:white;

  font-size:20px;

  background:#14283a;
}

#panelBody{
  padding:16px;
}

.statsGrid{
  display:grid;

  grid-template-columns:
  repeat(2,1fr);

  gap:10px;

  margin-bottom:14px;
}

.statBox{
  min-height:70px;

  border-radius:13px;

  padding:10px;

  background:
  rgba(255,255,255,.62);

  border:1px solid #c9b27e;

  color:#4d3d2b;
}

.statLabel{
  font-size:11px;
  color:#806b4d;
}

.statValue{
  margin-top:4px;

  font-size:20px;
  font-weight:900;
}

.actionButton{
  width:100%;

  margin-top:8px;

  padding:13px;

  border-radius:13px;

  color:white;

  font-size:15px;
  font-weight:900;

  background:
  linear-gradient(
    #dca538,
    #91601b
  );

  border:1px solid #f4d789;

  box-shadow:
  0 4px 8px rgba(0,0,0,.22);
}

.blueAction{
  background:
  linear-gradient(
    #4e8ac0,
    #28547a
  );
}

.redAction{
  background:
  linear-gradient(
    #d65c54,
    #85302c
  );
}

/* ============================= */
/* WORLD MAP */
/* ============================= */

#worldMap{
  position:absolute;
  inset:0;

  display:none;

  z-index:50;

  background:
  radial-gradient(
    ellipse at center,
    #3ca9d4,
    #07587d
  );
}

#worldMap.show{
  display:block;
}

#mapBack{
  position:absolute;

  top:90px;
  left:18px;

  width:52px;
  height:52px;

  border-radius:50%;

  background:
  linear-gradient(#345a73,#132b3e);

  border:2px solid #d8b663;

  color:white;

  font-size:25px;

  z-index:20;
}

.island{
  position:absolute;

  width:160px;
  height:115px;

  border-radius:50%;

  border:0;

  background:
  radial-gradient(
    ellipse,
    #77c45a 0 52%,
    #c2ab66 53% 62%,
    transparent 64%
  );

  color:white;
}

.islandName{
  position:absolute;

  left:50%;
  bottom:-12px;

  transform:translateX(-50%);

  padding:6px 9px;

  border-radius:8px;

  white-space:nowrap;

  background:
  rgba(11,29,45,.92);

  border:1px solid #d5b66d;

  font-size:11px;
  font-weight:900;
}

/*
These are temporary map objects.

Later we replace these islands
with actual illustrated island assets.
*/

#homeIsland{
  left:7%;
  bottom:17%;
}

#redIsland{
  right:7%;
  top:18%;
}

#greenIsland{
  right:15%;
  bottom:14%;
}

#centralIsland{
  left:44%;
  top:31%;
}

/* ============================= */
/* TOAST */
/* ============================= */

#toast{
  position:absolute;

  left:50%;
  top:100px;

  transform:
  translateX(-50%)
  translateY(-150px);

  max-width:80%;

  padding:11px 18px;

  border-radius:13px;

  background:
  rgba(11,27,42,.96);

  border:1px solid #d7b76b;

  color:white;

  font-weight:800;

  z-index:150;

  transition:.25s;
}

#toast.show{
  transform:
  translateX(-50%)
  translateY(0);
}

/* ============================= */
/* MOBILE */
/* ============================= */

@media(max-width:760px){

  #topHUD{
    gap:4px;
  }

  #playerPanel{
    min-width:195px;
    height:62px;
  }

  #avatarFrame{
    width:48px;
    height:48px;
  }

  #kingdomName{
    font-size:13px;
  }

  #kingdomStats{
    font-size:10px;
    gap:4px;
  }

  .resource{
    min-width:70px;
    height:42px;
    padding:4px 6px;
  }

  .resource img{
    width:24px;
    height:24px;
  }

  .resourceValue{
    font-size:11px;
  }

  .hudButton{
    width:62px;
    height:62px;
  }

  #attackButton{
    width:76px;
    height:76px;
  }

}

</style>
</head>


<body>

<div id="game">

<!-- ============================ -->
<!-- CITY -->
<!-- ============================ -->

<div id="city"></div>


<!-- ============================ -->
<!-- TOP HUD -->
<!-- ============================ -->

<div id="topHUD">

<div id="playerPanel">

<div id="avatarFrame">
<img
src="assets/avatar-king.png"
alt="">
</div>

<div id="playerInfo">

<div id="kingdomName">
The Children Kingdom
</div>

<div id="kingdomStats">

<span class="levelBadge">
Lv.<span id="level">1</span>
</span>

<span>
Power
<span id="power">
1250
</span>
</span>

</div>

</div>

</div>


<div id="resources">

<div class="resource">

<img
src="assets/icon-gold.png">

<div class="resourceValue"
id="gold">
1500
</div>

</div>


<div class="resource">

<img
src="assets/icon-wood.png">

<div class="resourceValue"
id="wood">
1200
</div>

</div>


<div class="resource">

<img
src="assets/icon-food.png">

<div class="resourceValue"
id="food">
1000
</div>

</div>


<div class="resource">

<img
src="assets/icon-stone.png">

<div class="resourceValue"
id="stone">
800
</div>

</div>


<div class="resource">

<img
src="assets/icon-gem.png">

<div class="resourceValue"
id="gem">
50
</div>

</div>

</div>

</div>


<!-- ============================ -->
<!-- BUILDING HOTSPOTS -->
<!-- ============================ -->

<button
id="castleHotspot"
class="hotspot">
</button>

<button
id="barracksHotspot"
class="hotspot">
</button>

<button
id="farmHotspot"
class="hotspot">
</button>

<button
id="mineHotspot"
class="hotspot">
</button>

<button
id="sawmillHotspot"
class="hotspot">
</button>

<button
id="academyHotspot"
class="hotspot">
</button>

<button
id="hospitalHotspot"
class="hotspot">
</button>

<button
id="shipyardHotspot"
class="hotspot">
</button>


<!-- ============================ -->
<!-- BOTTOM HUD -->
<!-- ============================ -->

<div id="bottomHUD">

<div class="bottomGroup">

<button
class="hudButton"
id="heroesBtn">

<img
src="assets/btn-heroes.png">

</button>


<button
class="hudButton"
id="allianceBtn">

<img
src="assets/btn-alliance.png">

</button>


<button
class="hudButton"
id="worldBtn">

<img
src="assets/btn-world.png">

</button>

</div>


<div class="bottomGroup">

<button
class="hudButton">

<img
src="assets/btn-mail.png">

</button>


<button
class="hudButton">

<img
src="assets/btn-more.png">

</button>


<button
id="attackButton">

<img
src="assets/btn-attack.png">

</button>

</div>

</div>


<!-- ============================ -->
<!-- WORLD MAP -->
<!-- ============================ -->

<div id="worldMap">

<button id="mapBack">
←
</button>


<button
id="homeIsland"
class="island">

<div class="islandName">
The Children Kingdom
</div>

</button>


<button
id="redIsland"
class="island enemy"
data-name="Red Fox Kingdom"
data-power="2200">

<div class="islandName">
Red Fox Kingdom
</div>

</button>


<button
id="greenIsland"
class="island enemy"
data-name="Green Leaf Kingdom"
data-power="1450">

<div class="islandName">
Green Leaf Kingdom
</div>

</button>


<button
id="centralIsland"
class="island enemy"
data-name="Crown Island"
data-power="5200">

<div class="islandName">
Crown Island
</div>

</button>

</div>


<!-- ============================ -->
<!-- PANEL -->
<!-- ============================ -->

<div id="panelOverlay"></div>

<div id="panel">

<div id="panelHeader">

<div id="panelTitle">
Building
</div>

<div id="panelSubtitle">
Kingdom information
</div>

<button id="closePanel">
×
</button>

</div>

<div id="panelBody">
</div>

</div>


<div id="toast">
</div>

</div>



<script>

/* ============================= */
/* DATA */
/* ============================= */

const game={

gold:1500,

wood:1200,

food:1000,

stone:800,

gem:50,

level:1,

soldiers:30,

ships:0,

buildings:{

castle:1,
barracks:1,
farm:1,
mine:1,
sawmill:1,
academy:1,
hospital:1,
shipyard:1

}

};


/* ============================= */
/* HELPERS */
/* ============================= */

function $(id){

return document.getElementById(id);

}


function updateUI(){

$("gold").innerText=
Math.floor(game.gold);

$("wood").innerText=
Math.floor(game.wood);

$("food").innerText=
Math.floor(game.food);

$("stone").innerText=
Math.floor(game.stone);

$("gem").innerText=
game.gem;

$("level").innerText=
game.level;


let power=

game.soldiers*30+
game.ships*450+
game.level*300;


$("power").innerText=
power;

}


function toast(message){

$("toast").innerText=
message;

$("toast").classList.add(
"show"
);

setTimeout(()=>{

$("toast").classList.remove(
"show"
);

},1600);

}


/* ============================= */
/* PANEL */
/* ============================= */

function openPanel(
title,
subtitle,
html
){

$("panelTitle").innerText=
title;

$("panelSubtitle").innerText=
subtitle;

$("panelBody").innerHTML=
html;

$("panel").classList.add(
"show"
);

$("panelOverlay").classList.add(
"show"
);

}


function closePanel(){

$("panel").classList.remove(
"show"
);

$("panelOverlay").classList.remove(
"show"
);

}


$("closePanel").onclick=
closePanel;

$("panelOverlay").onclick=
closePanel;


/* ============================= */
/* RESOURCE GENERATION */
/* ============================= */

setInterval(()=>{

game.gold+=
1+
game.buildings.mine*.8;

game.food+=
1+
game.buildings.farm*.9;

game.wood+=
1+
game.buildings.sawmill*.8;

updateUI();

},1000);


/* ============================= */
/* CASTLE */
/* ============================= */

$("castleHotspot").onclick=()=>{

openPanel(

"Royal Castle",

"Heart of your kingdom",

`

<div class="statsGrid">

<div class="statBox">

<div class="statLabel">
Castle Level
</div>

<div class="statValue">
${game.buildings.castle}
</div>

</div>


<div class="statBox">

<div class="statLabel">
Kingdom Level
</div>

<div class="statValue">
${game.level}
</div>

</div>


<div class="statBox">

<div class="statLabel">
Soldiers
</div>

<div class="statValue">
${game.soldiers}
</div>

</div>


<div class="statBox">

<div class="statLabel">
Warships
</div>

<div class="statValue">
${game.ships}
</div>

</div>

</div>


<button
class="actionButton"
onclick="upgradeCastle()">

Upgrade Castle

</button>

`

);

};


function upgradeCastle(){

let cost=

game.buildings.castle*500;


if(game.gold<cost){

toast(
"Not enough gold"
);

return;

}


game.gold-=cost;

game.buildings.castle++;

game.level++;

updateUI();

toast(
"Castle upgraded"
);

closePanel();

}


/* ============================= */
/* SHIPYARD */
/* ============================= */

$("shipyardHotspot").onclick=
openShipyard;


function openShipyard(){

openPanel(

"Royal Shipyard",

"Build fleets for overseas war",

`

<div class="statsGrid">

<div class="statBox">

<div class="statLabel">
Shipyard Level
</div>

<div class="statValue">
${game.buildings.shipyard}
</div>

</div>


<div class="statBox">

<div class="statLabel">
Warships
</div>

<div class="statValue">
${game.ships}
</div>

</div>

</div>


<button
class="actionButton blueAction"
onclick="buildShip()">

Build Warship

<br>

300 Gold + 250 Wood

</button>


<button
class="actionButton"
onclick="upgradeShipyard()">

Upgrade Shipyard

</button>

`

);

}


function buildShip(){

if(
game.gold<300||
game.wood<250
){

toast(
"Not enough resources"
);

return;

}


game.gold-=300;

game.wood-=250;

game.ships++;

updateUI();

toast(
"Warship completed"
);

openShipyard();

}


function upgradeShipyard(){

let cost=

game.buildings.shipyard*400;


if(game.gold<cost){

toast(
"Not enough gold"
);

return;

}


game.gold-=cost;

game.buildings.shipyard++;

updateUI();

toast(
"Shipyard upgraded"
);

openShipyard();

}


/* ============================= */
/* BARRACKS */
/* ============================= */

$("barracksHotspot").onclick=()=>{

openPanel(

"Barracks",

"Train armies for war",

`

<div class="statsGrid">

<div class="statBox">

<div class="statLabel">
Soldiers
</div>

<div class="statValue">
${game.soldiers}
</div>

</div>


<div class="statBox">

<div class="statLabel">
Barracks Level
</div>

<div class="statValue">
${game.buildings.barracks}
</div>

</div>

</div>


<button
class="actionButton redAction"
onclick="trainSoldiers()">

Train 10 Soldiers

<br>

120 Gold + 150 Food

</button>

`

);

};


function trainSoldiers(){

if(
game.gold<120||
game.food<150
){

toast(
"Not enough resources"
);

return;

}


game.gold-=120;

game.food-=150;

game.soldiers+=10;

updateUI();

toast(
"10 soldiers trained"
);

}


/* ============================= */
/* GENERIC BUILDING */
/* ============================= */

function buildingPanel(
name,
key,
description
){

openPanel(

name,

description,

`

<div class="statsGrid">

<div class="statBox">

<div class="statLabel">
Building Level
</div>

<div class="statValue">
${game.buildings[key]}
</div>

</div>

</div>


<button
class="actionButton"
onclick="upgradeBuilding('${key}')">

Upgrade

</button>

`

);

}


$("farmHotspot").onclick=()=>{

buildingPanel(
"Farm",
"farm",
"Produces food"
);

};


$("mineHotspot").onclick=()=>{

buildingPanel(
"Gold Mine",
"mine",
"Produces gold"
);

};


$("sawmillHotspot").onclick=()=>{

buildingPanel(
"Sawmill",
"sawmill",
"Produces wood"
);

};


$("academyHotspot").onclick=()=>{

buildingPanel(
"Academy",
"academy",

/* ============================= */
/* ATTACK */
/* ============================= */

function attackIsland(
name,
enemyPower
){

if(game.ships<1){

toast(
"Build a warship first"
);

return;

}


let ownPower=

game.soldiers*30+
game.ships*450+
900;


let winChance=

ownPower/
(
ownPower+
enemyPower
);


let win=

Math.random()
<
winChance;


closePanel();


if(win){

let goldLoot=

300+
Math.floor(
Math.random()*400
);


let woodLoot=

180+
Math.floor(
Math.random()*250
);


let casualties=

Math.floor(
game.soldiers*.12
);


game.soldiers=

Math.max(
0,
game.soldiers-
casualties
);


game.gold+=
goldLoot;


game.wood+=
woodLoot;


updateUI();


toast(
"Victory! Enemy island defeated."
);

}

else{

let casualties=

Math.max(
5,
Math.floor(
game.soldiers*.3
)
);


game.soldiers=

Math.max(
0,
game.soldiers-
casualties
);


let goldLoss=

Math.floor(
game.gold*.15
);


game.gold-=goldLoss;


updateUI();


toast(
"Defeat. Rebuild your kingdom."
);

}

}

updateUI();

</script>
