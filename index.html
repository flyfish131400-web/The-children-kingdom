<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>The Children Kingdom</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050b12;
  font-family:Arial,Helvetica,sans-serif;
}

/* GAME */

#game{
  position:relative;
  width:100vw;
  height:100vh;
  background:#050b12;
  overflow:hidden;
}

/* REAL HIGH QUALITY ART */

#art{
  position:absolute;
  inset:0;

  background-image:url("kingdom-ui.png");
  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;

  transition:
    transform .2s ease,
    filter .2s ease;
}

/* CLICKABLE AREAS */

.hotspot{
  position:absolute;
  z-index:20;
  border:0;
  background:transparent;
  cursor:pointer;
}

/* castle */

#castle{
  left:41%;
  top:15%;
  width:34%;
  height:39%;
}

/* barracks */

#barracks{
  left:13%;
  top:25%;
  width:24%;
  height:20%;
}

/* academy */

#academy{
  left:18%;
  top:42%;
  width:23%;
  height:17%;
}

/* mine */

#mine{
  right:4%;
  top:27%;
  width:21%;
  height:18%;
}

/* farm */

#farm{
  right:2%;
  top:43%;
  width:25%;
  height:18%;
}

/* shipyard */

#shipyard{
  right:11%;
  top:55%;
  width:32%;
  height:23%;
}

/* alliance */

#alliance{
  left:0%;
  top:27%;
  width:13%;
  height:12%;
}

/* heroes */

#heroes{
  left:15%;
  bottom:0%;
  width:17%;
  height:11%;
}

/* world map */

#world{
  left:43%;
  bottom:0%;
  width:19%;
  height:11%;
}

/* attack */

#attack{
  right:1%;
  bottom:14%;
  width:18%;
  height:17%;
}

/* LIVE DATA LAYER */

#liveHud{
  position:absolute;
  z-index:30;

  top:max(12px,env(safe-area-inset-top));
  left:50%;

  transform:translateX(-50%);

  display:flex;
  gap:6px;

  pointer-events:none;
}

.resource{
  min-width:74px;

  padding:6px 9px;

  border-radius:10px;

  background:rgba(8,18,30,.88);
  border:1px solid rgba(212,177,92,.7);

  color:white;

  text-align:center;

  box-shadow:0 3px 9px rgba(0,0,0,.4);
}

.resource small{
  display:block;
  font-size:8px;
  color:#d7c291;
}

.resource strong{
  display:block;
  font-size:12px;
  margin-top:2px;
}

/* DARK OVERLAY */

#shade{
  display:none;

  position:absolute;
  inset:0;

  z-index:70;

  background:rgba(3,8,15,.55);
  backdrop-filter:blur(2px);
}

#shade.show{
  display:block;
}

/* PANEL */

#panel{
  position:absolute;

  left:50%;
  bottom:-700px;

  transform:translateX(-50%);

  width:min(600px,94vw);

  z-index:80;

  border-radius:24px 24px 0 0;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #fff8e5,
      #dfc995
    );

  border:2px solid #c69b42;

  box-shadow:
    0 -20px 60px rgba(0,0,0,.65);

  transition:bottom .3s ease;
}

#panel.show{
  bottom:0;
}

#panelHeader{
  position:relative;

  padding:16px 55px 13px 18px;

  background:
    linear-gradient(
      #243d59,
      #0c1b2b
    );

  color:white;
}

#panelTitle{
  font-size:22px;
  font-weight:900;
}

#panelSub{
  margin-top:3px;
  font-size:11px;
  color:#d4dce3;
}

#closePanel{
  position:absolute;

  right:13px;
  top:12px;

  width:36px;
  height:36px;

  border:0;
  border-radius:50%;

  background:#07131f;

  color:white;

  font-size:20px;
}

#panelBody{
  padding:16px;
}

/* CARDS */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.card{
  padding:11px;

  border-radius:13px;

  background:rgba(255,255,255,.58);

  border:1px solid #bd9d59;

  color:#352a1e;
}

.card small{
  display:block;
  font-size:10px;
  color:#766347;
}

.card strong{
  display:block;
  margin-top:3px;
  font-size:19px;
}

/* BUTTONS */

.action{
  width:100%;

  margin-top:10px;

  padding:13px;

  border-radius:12px;

  border:1px solid #f0cf77;

  background:
    linear-gradient(
      #dba337,
      #8a5915
    );

  color:white;

  font-weight:900;

  font-size:15px;

  box-shadow:
    0 4px 9px rgba(0,0,0,.25);
}

.action.red{
  background:
    linear-gradient(
      #cf5d53,
      #802c28
    );
}

.action.blue{
  background:
    linear-gradient(
      #4c89c1,
      #254d73
    );
}

.action.green{
  background:
    linear-gradient(
      #61ad58,
      #33773a
    );
}

/* WORLD MAP */

#worldMap{
  display:none;

  position:absolute;
  inset:0;

  z-index:60;

  background:
    linear-gradient(
      #184c70,
      #052f4d
    );
}

#worldMap.show{
  display:block;
}

#mapBack{
  position:absolute;

  top:max(18px,env(safe-area-inset-top));
  left:15px;

  width:48px;
  height:48px;

  border-radius:50%;

  border:2px solid #d2ad5f;

  background:#122b40;

  color:white;

  font-size:24px;

  z-index:10;
}

#mapTitle{
  position:absolute;

  top:max(26px,env(safe-area-inset-top));

  left:50%;

  transform:translateX(-50%);

  color:white;

  font-size:21px;
  font-weight:900;
}

/* island cards */

.island{
  position:absolute;

  width:150px;
  min-height:92px;

  padding:12px;

  border-radius:18px;

  border:2px solid #c9a252;

  background:
    linear-gradient(
      rgba(34,67,85,.95),
      rgba(8,29,45,.97)
    );

  color:white;

  box-shadow:
    0 10px 25px rgba(0,0,0,.35);
}

.island strong{
  display:block;
  font-size:15px;
}

.island small{
  display:block;
  margin-top:6px;
  color:#d4c18f;
}

#ourIsland{
  left:7%;
  bottom:18%;
}

#redIsland{
  right:6%;
  top:17%;
}

#greenIsland{
  right:12%;
  bottom:14%;
}

#crownIsland{
  left:43%;
  top:31%;
}

/* TOAST */

#toast{
  position:absolute;

  z-index:200;

  left:50%;
  top:90px;

  transform:
    translateX(-50%)
    translateY(-150px);

  max-width:85%;

  padding:11px 17px;

  border-radius:13px;

  background:rgba(6,20,32,.96);
  border:1px solid #c9a24e;

  color:white;

  font-weight:800;
  text-align:center;

  transition:.25s;
}

#toast.show{
  transform:
    translateX(-50%)
    translateY(0);
}

/* MOBILE */

@media(max-width:700px){

  #liveHud{
    top:auto;
    bottom:
      calc(
        12px +
        env(safe-area-inset-bottom)
      );

    gap:3px;
  }

  .resource{
    min-width:57px;
    padding:5px;
  }

  .resource small{
    font-size:7px;
  }

  .resource strong{
    font-size:9px;
  }

  .island{
    width:120px;
    min-height:80px;
    padding:8px;
  }

}

</style>
</head>

<body>

<div id="game">

<div id="art"></div>


<!-- LIVE RESOURCE VALUES -->

<div id="liveHud">

  <div class="resource">
    <small>GOLD</small>
    <strong id="gold">128600</strong>
  </div>

  <div class="resource">
    <small>WOOD</small>
    <strong id="wood">96400</strong>
  </div>

  <div class="resource">
    <small>FOOD</small>
    <strong id="food">72800</strong>
  </div>

  <div class="resource">
    <small>STONE</small>
    <strong id="stone">54300</strong>
  </div>

</div>


<!-- HOTSPOTS -->

<button id="castle" class="hotspot"></button>
<button id="barracks" class="hotspot"></button>
<button id="academy" class="hotspot"></button>
<button id="mine" class="hotspot"></button>
<button id="farm" class="hotspot"></button>
<button id="shipyard" class="hotspot"></button>
<button id="alliance" class="hotspot"></button>
<button id="heroes" class="hotspot"></button>
<button id="world" class="hotspot"></button>
<button id="attack" class="hotspot"></button>


<!-- WORLD MAP -->

<div id="worldMap">

  <button id="mapBack">←</button>

  <div id="mapTitle">
    WORLD MAP
  </div>


  <button
    id="ourIsland"
    class="island">

    <strong>
      The Children Kingdom
    </strong>

    <small>
      Your Capital
    </small>

  </button>


  <button
    id="redIsland"
    class="island enemy"
    data-name="Red Fox Kingdom"
    data-power="3200">

    <strong>
      Red Fox Kingdom
    </strong>

    <small>
      Power 3,200
    </small>

  </button>


  <button
    id="greenIsland"
    class="island enemy"
    data-name="Green Leaf Kingdom"
    data-power="2100">

    <strong>
      Green Leaf Kingdom
    </strong>

    <small>
      Power 2,100
    </small>

  </button>


  <button
    id="crownIsland"
    class="island enemy"
    data-name="Crown Island"
    data-power="7200">

    <strong>
      Crown Island
    </strong>

    <small>
      Power 7,200
    </small>

  </button>

</div>


<!-- PANEL -->

<div id="shade"></div>

<div id="panel">

  <div id="panelHeader">

    <div id="panelTitle"></div>

    <div id="panelSub"></div>

    <button id="closePanel">
      ×
    </button>

  </div>

  <div id="panelBody"></div>

</div>


<div id="toast"></div>

</div>


<script>

/* ==========================
   SAVE
========================== */

let state={

  gold:128600,
  wood:96400,
  food:72800,
  stone:54300,

  castle:15,
  barracks:12,
  academy:10,
  mine:12,
  farm:12,
  shipyard:13,

  soldiers:220,
  ships:3,

  guild:"Blue Crown Alliance"

};


const stored=
localStorage.getItem(
  "TCK_SAVE_V3"
);


if(stored){

  try{

    state=
    Object.assign(
      state,
      JSON.parse(stored)
    );

  }catch(e){}

}


function save(){

  localStorage.setItem(
    "TCK_SAVE_V3",
    JSON.stringify(state)
  );

}


/* ==========================
   HELPERS
========================== */

function $(id){

  return document
  .getElementById(id);

}


function num(n){

  if(n>=1000000)
    return(
      n/1000000
    ).toFixed(1)+"M";

  if(n>=1000)
    return(
      n/1000
    ).toFixed(1)+"K";

  return Math.floor(n);

}


function update(){

  $("gold").innerText=
  num(state.gold);

  $("wood").innerText=
  num(state.wood);

  $("food").innerText=
  num(state.food);

  $("stone").innerText=
  num(state.stone);

  save();

}


/* ==========================
   TOAST
========================== */

function toast(message){

  $("toast").innerText=
  message;

  $("toast")
  .classList.add("show");


  setTimeout(()=>{

    $("toast")
    .classList.remove("show");

  },1700);

}


/* ==========================
   PANEL
========================== */

function openPanel(
  title,
  subtitle,
  html
){

  $("panelTitle").innerText=
  title;

  $("panelSub").innerText=
  subtitle;

  $("panelBody").innerHTML=
  html;

  $("shade")
  .classList.add("show");

  $("panel")
  .classList.add("show");

}


function closePanel(){

  $("shade")
  .classList.remove("show");

  $("panel")
  .classList.remove("show");

}


$("closePanel").onclick=
closePanel;

$("shade").onclick=
closePanel;


/* ==========================
   RESOURCE SPEED
========================== */

/*
IMPORTANT:

Resources no longer explode.

Only one small update
every 30 seconds.
*/

setInterval(()=>{

  state.gold += 25;
  state.wood += 18;
  state.food += 22;
  state.stone += 8;

  update();

},30000);


/* ==========================
   CASTLE
========================== */

$("castle").onclick=()=>{

  const cost=
  state.castle*
  12000;


  openPanel(

    "Royal Castle",

    "Capital of The Children Kingdom",

    `

    <div class="grid">

      <div class="card">

        <small>Castle Level</small>

        <strong>
        ${state.castle}
        </strong>

      </div>


      <div class="card">

        <small>Soldiers</small>

        <strong>
        ${state.soldiers}
        </strong>

      </div>


      <div class="card">

        <small>Warships</small>

        <strong>
        ${state.ships}
        </strong>

      </div>


      <div class="card">

        <small>Alliance</small>

        <strong>
        Blue Crown
        </strong>

      </div>

    </div>


    <button
    class="action green"
    onclick="upgradeCastle()">

      Upgrade Castle

      <br>

      ${num(cost)} Gold

    </button>

    `

  );

};


function upgradeCastle(){

  const cost=
  state.castle*
  12000;


  if(
    state.gold<
    cost
  ){

    toast(
      "Not enough gold"
    );

    return;

  }


  state.gold-=cost;

  state.castle++;


  update();

  closePanel();


  toast(
    "Castle upgraded to Lv."
    +state.castle
  );

}


/* ==========================
   BARRACKS
========================== */

$("barracks").onclick=()=>{

  openPanel(

    "Barracks",

    "Train your royal army",

    `

    <div class="grid">

      <div class="card">

        <small>Barracks Level</small>

        <strong>
        ${state.barracks}
        </strong>

      </div>


      <div class="card">

        <small>Soldiers</small>

        <strong>
        ${state.soldiers}
        </strong>

      </div>

    </div>


    <button
    class="action red"
    onclick="trainArmy()">

      Train 20 Soldiers

      <br>

      8K Gold + 5K Food

    </button>

    `

  );

};


function trainArmy(){

  if(
    state.gold<8000 ||
    state.food<5000
  ){

    toast(
      "Not enough resources"
    );

    return;

  }


  state.gold-=8000;

  state.food-=5000;

  state.soldiers+=20;


  update();

  closePanel();


  toast(
    "20 soldiers trained"
  );

}


/* ==========================
   SHIPYARD
========================== */

$("shipyard").onclick=()=>{

  openPanel(

    "Royal Shipyard",

    "Build fleets for overseas war",

    `

    <div class="grid">

      <div class="card">

        <small>Shipyard Level</small>

        <strong>
        ${state.shipyard}
        </strong>

      </div>


      <div class="card">

        <small>Warships</small>

        <strong>
        ${state.ships}
        </strong>

      </div>

    </div>


    <button
    class="action blue"
    onclick="buildShip()">

      Build Warship

      <br>

      20K Gold + 15K Wood

    </button>

    `

  );

};


function buildShip(){

  if(
    state.gold<20000 ||
    state.wood<15000
  ){

    toast(
      "Not enough resources"
    );

    return;

  }


  state.gold-=20000;

  state.wood-=15000;

  state.ships++;


  update();

  closePanel();


  toast(
    "New warship launched"
  );

}


/* ==========================
   FARM
========================== */

$("farm").onclick=()=>{

  openPanel(

    "Royal Farm",

    "Food production",

    `

    <div class="grid">

      <div class="card">

        <small>Farm Level</small>

        <strong>
        ${state.farm}
        </strong>

      </div>

      <div class="card">

        <small>Food Storage</small>

        <strong>
        ${num(state.food)}
        </strong>

      </div>

    </div>

    `

  );

};


/* ==========================
   MINE
========================== */

$("mine").onclick=()=>{

  openPanel(

    "Gold Mine",

    "Kingdom treasury",

    `

    <div class="grid">

      <div class="card">

        <small>Mine Level</small>

        <strong>
        ${state.mine}
        </strong>

      </div>

      <div class="card">

        <small>Gold</small>

        <strong>
        ${num(state.gold)}
        </strong>

      </div>

    </div>

    `

  );

};


/* ==========================
   ACADEMY
========================== */

$("academy").onclick=()=>{

  openPanel(

    "Royal Academy",

    "Military technology",

    `

    <div class="grid">

      <div class="card">

        <small>Academy Level</small>

        <strong>
        ${state.academy}
        </strong>

      </div>

      <div class="card">

        <small>Research</small>

        <strong>
        Military I
        </strong>

      </div>

    </div>

    `

  );

};


/* ==========================
   HEROES
========================== */

$("heroes").onclick=()=>{

  openPanel(

    "Royal Heroes",

    "Commanders of the kingdom",

    `

    <div class="grid">

      <div class="card">

        <small>Princess Mia</small>

        <strong>
        Navy
        </strong>

      </div>

      <div class="card">

        <small>Prince Leo</small>

        <strong>
        Army
        </strong>

      </div>

      <div class="card">

        <small>Commander Ben</small>

        <strong>
        Defence
        </strong>

      </div>

      <div class="card">

        <small>Next Hero</small>

        <strong>
        Locked
        </strong>

      </div>

    </div>

    `

  );

};


/* ==========================
   ALLIANCE
========================== */

$("alliance").onclick=()=>{

  openPanel(

    state.guild,

    "Alliance Headquarters",

    `

    <div class="grid">

      <div class="card">

        <small>Members</small>

        <strong>
        4
        </strong>

      </div>

      <div class="card">

        <small>Alliance Power</small>

        <strong>
        9.2K
        </strong>

      </div>

    </div>


    <button
    class="action blue"
    onclick="
    toast(
      'Alliance rally ready'
    )
    ">

      Prepare Rally

    </button>

    `

  );

};


/* ==========================
   WORLD MAP
========================== */

function world(){

  $("worldMap")
  .classList.add("show");

  closePanel();

}


$("world").onclick=
world;

$("attack").onclick=
world;


$("mapBack").onclick=()=>{

  $("worldMap")
  .classList.remove("show");

};


/* ==========================
   ENEMY
========================== */

document
.querySelectorAll(
  ".enemy"
)
.forEach(

island=>{

  island.onclick=()=>{

    const name=
    island.dataset.name;

    const enemyPower=
    Number(
      island.dataset.power
    );


    const rallyPower=

    state.soldiers*20
    +
    state.ships*550
    +
    1200;


    let risk;


    if(
      rallyPower >
      enemyPower*1.4
    )

      risk="LOW";


    else if(
      rallyPower >=
      enemyPower
    )

      risk="MEDIUM";


    else if(
      rallyPower >=
      enemyPower*.7
    )

      risk="HIGH";


    else

      risk="EXTREME";


    openPanel(

      name,

      "Enemy Kingdom",

      `

      <div class="grid">

        <div class="card">

          <small>Enemy Power</small>

          <strong>
          ${num(enemyPower)}
          </strong>

        </div>


        <div class="card">

          <small>Rally Power</small>

          <strong>
          ${num(rallyPower)}
          </strong>

        </div>


        <div class="card">

          <small>Risk</small>

          <strong>
          ${risk}
          </strong>

        </div>


        <div class="card">

          <small>Warships</small>

          <strong>
          ${state.ships}
          </strong>

        </div>

      </div>


      <button
      class="action red"
      onclick="
      attackEnemy(
        '${name}',
        ${enemyPower}
      )
      ">

        Alliance Rally Attack

      </button>

      `

    );

  };

}

);


/* ==========================
   WAR
========================== */

function attackEnemy(
  name,
  enemyPower
){

  if(
    state.ships<1
  ){

    toast(
      "You need a warship"
    );

    return;

  }


  const rallyPower=

  state.soldiers*20
  +
  state.ships*550
  +
  1200;


  const chance=

  rallyPower/
  (
    rallyPower+
    enemyPower
  );


  const win=
  Math.random()
  <
  chance;


  closePanel();


  if(win){

    const lootGold=

    10000+
    Math.floor(
      Math.random()*15000
    );


    const lootWood=

    6000+
    Math.floor(
      Math.random()*8000
    );


    const casualties=

    Math.max(
      4,
      Math.floor(
        state.soldiers*.08
      )
    );


    state.gold+=lootGold;

    state.wood+=lootWood;

    state.soldiers=
    Math.max(
      0,
      state.soldiers-
      casualties
    );


    update();


    toast(
      "VICTORY — "
      +name+
      " defeated"
    );

  }

  else{

    const casualties=

    Math.max(
      10,
      Math.floor(
        state.soldiers*.25
      )
    );


    state.soldiers=
    Math.max(
      0,
      state.soldiers-
      casualties
    );


    state.gold=
    Math.floor(
      state.gold*.85
    );


    if(
      state.ships>0 &&
      Math.random()<.35
    ){

      state.ships--;

    }


    update();


    toast(
      "DEFEAT — rebuild your kingdom"
    );

  }

}

update();

</script>
