<html lang="en">
<head>

<title>The Children Kingdom</title>

<style>
  *{
    box-sizing:border-box;
  }

  html,
  body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#071521;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:white;
    touch-action:none;
  }

  canvas{
    display:block;
    width:100%;
    height:100%;
  }

  #loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 35%,#21475e,#071521 72%);
    transition:opacity .5s ease;
  }

  #loading.hidden{
    opacity:0;
    pointer-events:none;
  }

  .load-card{
    width:min(82vw,420px);
    padding:28px;
    border-radius:24px;
    background:rgba(4,16,25,.82);
    border:1px solid rgba(244,202,112,.45);
    box-shadow:0 20px 60px rgba(0,0,0,.38);
    backdrop-filter:blur(16px);
  }

  .load-title{
    font-size:22px;
    font-weight:900;
    letter-spacing:.2px;
  }

  .load-sub{
    margin-top:6px;

    font-size:13px;

  .bar{
    margin-top:22px;
    height:8px;
    overflow:hidden;
    border-radius:20px;
    background:rgba(255,255,255,.12);

  #barFill{
    width:0%;
    height:100%;

  .load-row{
    display:flex;

    justify-content:space-between;
    margin-top:10px;
    font-size:12px;
  }

  #hud{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
  }

  .topbar{
    position:absolute;
    top:max(10px,env(safe-area-inset-top));
    left:10px;
    right:10px;
    display:flex;

    justify-content:space-between;
    gap:10px;

  .brand{
    min-width:170px;
    padding:10px 13px;
    border-radius:17px;
    background:rgba(5,21,34,.72);
    border:1px solid rgba(240,199,109,.45);
    backdrop-filter:blur(12px);
    box-shadow:0 6px 25px rgba(0,0,0,.22);

  .brand strong{
    display:block;
    font-size:14px;
  }

  .brand span{
    display:block;

  .resources{

    border-radius:17px;
    background:rgba(5,21,34,.72);

  .resource:first-child{

  }

  .resource small{

    font-size:8px;
    opacity:.55;
  }

  .resource b{
    display:block;
    margin-top:1px;
    font-size:11px;
  }

  .crosshair{

    left:50%;
    top:50%;
    width:8px;
    height:8px;

    margin-top:-4px;
    border:1px solid rgba(255,255,255,.92);

  #prompt{

    text-align:center;

/* ========================================
   MODEL FILES
======================================== */

const modelFiles = {

  castle:"castle.glb",

  gate:"gate.glb",

  farm:"farm.glb",

  barn:"barn.glb",

  mine:"mine.glb",

  port:"port.glb",

  guard:"guard.glb",

  archer:"archer.glb",

  king:"king.glb"

};


const loader =
  new GLTFLoader();

const cache = {};

const modelEntries =
  Object.entries(
    modelFiles
  );

let loadDone = 0;


/* ========================================
   LOADING UI
======================================== */

function loadingStep(
  text
){

  loadDone++;

  const pct =
    Math.round(
      loadDone /
      modelEntries.length *
      100
    );

  document
    .getElementById(
      "barFill"
    )
    .style.width =
    pct + "%";

  document
    .getElementById(
      "loadPct"
    )
    .textContent =
    pct + "%";

  document
    .getElementById(
      "loadText"
    )
    .textContent =
    text;

}


function loadOne(
  name,
  url
){

  return new Promise(
    resolve => {

      loader.load(

        url,

        gltf => {

          cache[name] =
            gltf;

          loadingStep(
            "Loaded " + name
          );

          resolve();

        },

        undefined,

        err => {

          console.warn(
            "Failed model:",
            name,
            err
          );

          loadingStep(
            "Skipped " + name
          );

          resolve();

        }

      );

    }
  );

}


await Promise.all(

  modelEntries.map(

    ([name,url]) =>
      loadOne(
        name,
        url
      )

  )

);


/* ========================================
   MODEL HELPERS
======================================== */

const interactables = [];

const mixers = [];


function fitModelHeight(
  obj,
  height
){

  const box =
    new THREE.Box3()
      .setFromObject(obj);

  const size =
    new THREE.Vector3();

  box.getSize(size);

  const scale =
    height /
    Math.max(
      size.y,
      .001
    );

  obj.scale.setScalar(
    scale
  );

}


function groundModel(
  obj
){

  const box =
    new THREE.Box3()
      .setFromObject(obj);

  obj.position.y -=
    box.min.y;

}


function applyMeshSettings(
  obj
){

  obj.traverse(
    child => {

      if(child.isMesh){

        child.castShadow =
          true;

        child.receiveShadow =
          true;

      }

    }
  );

}


function placeModel(
  name,
  x,
  z,
  height,
  rot = 0,
  canInteract = false,
  action = ""
){

  const gltf =
    cache[name];

  if(!gltf){
    return null;
  }

  const obj =
    gltf.scene.clone(true);

  applyMeshSettings(obj);

  fitModelHeight(
    obj,
    height
  );

  groundModel(obj);

  obj.position.x =
    x;

  obj.position.z =
    z;

  obj.rotation.y =
    rot;

  obj.userData.label =
    name.toUpperCase();

  obj.userData.action =
    action;

  scene.add(obj);

  if(canInteract){

    interactables.push(
      obj
    );

  }

  return obj;

}

/* ========================================
   NPCS
======================================== */

function addNPC(
  name,
  x,
  z,
  height = 2.1,
  rotation = Math.PI
){

  const gltf =
    cache[name];

  if(!gltf){
    return null;
  }

  const npc =
    clone(
      gltf.scene
    );

  applyMeshSettings(
    npc
  );

  fitModelHeight(
    npc,
    height
  );

  groundModel(
    npc
  );

  npc.position.x =
    x;

  npc.position.z =
    z;

  npc.rotation.y =
    rotation;

  scene.add(npc);

  if(
    gltf.animations &&
    gltf.animations.length
  ){

    const mixer =
      new THREE.AnimationMixer(
        npc
      );

    let clip =
      gltf.animations.find(
        a =>
          /idle/i.test(
            a.name
          )
      );

    if(!clip){

      clip =
        gltf.animations[0];

    }

    mixer
      .clipAction(
        clip
      )
      .play();

    mixers.push(
      mixer
    );

  }

  return npc;

}

/* ========================================
   JOYSTICK
======================================== */

const joystick =
  document.getElementById(
    "joystick"
  );

const stick =
  document.getElementById(
    "stick"
  );

let joyId = null;

let joyX = 0;

let joyY = 0;


joystick.addEventListener(
  "pointerdown",
  e => {

    joyId =
      e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

  }
);


joystick.addEventListener(
  "pointermove",
  e => {

    if(
      e.pointerId !==
      joyId
    ){
      return;
    }

    const rect =
      joystick
      .getBoundingClientRect();

    let dx =
      e.clientX -
      (
        rect.left +
        rect.width / 2
      );

    let dy =
      e.clientY -
      (
        rect.top +
        rect.height / 2
      );

    const max =
      rect.width *
      .32;

    const len =
      Math.hypot(
        dx,
        dy
      );

    if(len > max){

      dx *=
        max / len;

      dy *=
        max / len;

    }

    joyX =
      dx / max;

    joyY =
      dy / max;

    stick.style.transform =
      `translate(${dx}px,${dy}px)`;

  }
);


function resetJoy(){

  joyId = null;

  joyX = 0;

  joyY = 0;

  stick.style.transform =
    "translate(0px,0px)";

}


joystick.addEventListener(
  "pointerup",
  resetJoy
);

joystick.addEventListener(
  "pointercancel",
  resetJoy
);


/* ========================================
   CAMERA LOOK
======================================== */

const lookpad =
  document.getElementById(
    "lookpad"
  );

let lookId = null;

let lastX = 0;

let lastY = 0;


lookpad.addEventListener(
  "pointerdown",
  e => {

    lookId =
      e.pointerId;

    lastX =
      e.clientX;

    lastY =
      e.clientY;

  }
);


lookpad.addEventListener(
  "pointermove",
  e => {

    if(
      e.pointerId !==
      lookId ||
      overview
    ){
      return;
    }

    const dx =
      e.clientX -
      lastX;

    const dy =
      e.clientY -
      lastY;

    yaw -=
      dx *
      .004;

    pitch -=
      dy *
      .003;

    pitch =
      THREE.MathUtils.clamp(
        pitch,
        -1.05,
        1.05
      );

    lastX =
      e.clientX;

    lastY =
      e.clientY;

  }
);


lookpad.addEventListener(
  "pointerup",
  () => {

    lookId = null;

  }
);

lookpad.addEventListener(
  "pointercancel",
  () => {

    lookId = null;

  }
);


/* ========================================
   OVERVIEW MODE
======================================== */

const modeBtn =
  document.getElementById(
    "modeBtn"
  );

function setOverview(
  state
){

  overview =
    state;

  modeBtn.textContent =
    overview
      ? "RETURN TO KING"
      : "KINGDOM VIEW";

  document
    .querySelector(
      ".crosshair"
    )
    .style.display =
    overview
      ? "none"
      : "block";

  document
    .getElementById(
      "joystick"
    )
    .style.display =
    overview
      ? "none"
      : "block";

  if(overview){

    camera.position.set(
      0,
      58,
      68
    );

    camera.lookAt(
      0,
      0,
      0
    );

  }

}


modeBtn.addEventListener(
  "click",
  () => {

    setOverview(
      !overview
    );

  }
);


/* ========================================
   INTERACTION
======================================== */

const prompt =
  document.getElementById(
    "prompt"
  );

const promptTitle =
  document.getElementById(
    "promptTitle"
  );

const promptSub =
  document.getElementById(
    "promptSub"
  );

const notice =
  document.getElementById(
    "notice"
  );


function nearestInteractable(){

  let closest = null;

  let bestDistance = 8;

  for(
    const obj
    of interactables
  ){

    const p =
      new THREE.Vector3();

    obj.getWorldPosition(
      p
    );

    const d =
      Math.hypot(
        player.x - p.x,
        player.z - p.z
      );

    if(
      d <
      bestDistance
    ){

      bestDistance =
        d;

      closest =
        obj;

    }

  }

  return closest;

}


function showNotice(
  text
){

  notice.textContent =
    text;

  notice.classList.add(
    "show"
  );

  setTimeout(
    () => {

      notice.classList.remove(
        "show"
      );

    },
    1800
  );

}


document
  .getElementById(
    "interactBtn"
  )
  .addEventListener(
    "click",
    () => {

      if(
        !currentInteractable
      ){
        return;
      }

      showNotice(
        currentInteractable
        .userData
        .action
      );

    }
  );


/* ========================================
   PLAYER MOVEMENT
======================================== */

function updatePlayer(
  dt
){

  let forward =
    (
      keys["KeyW"]
        ? 1
        : 0
    )
    -
    (
      keys["KeyS"]
        ? 1
        : 0
    )
    -
    joyY;

  let side =
    (
      keys["KeyD"]
        ? 1
        : 0
    )
    -
    (
      keys["KeyA"]
        ? 1
        : 0
    )
    +
    joyX;

  const len =
    Math.hypot(
      forward,
      side
    );

  if(len > 1){

    forward /=
      len;

    side /=
      len;

  }

  const speed =
    6;

  const forwardX =
    -Math.sin(
      yaw
    );

  const forwardZ =
    -Math.cos(
      yaw
    );

  const rightX =
    Math.cos(
      yaw
    );

  const rightZ =
    -Math.sin(
      yaw
    );

  player.x +=
    (
      forwardX *
      forward
      +
      rightX *
      side
    )
    *
    speed *
    dt;

  player.z +=
    (
      forwardZ *
      forward
      +
      rightZ *
      side
    )
    *
    speed *
    dt;

  const radius =
    Math.hypot(
      player.x,
      player.z
    );

  if(radius > 49){

    player.x *=
      49 /
      radius;

    player.z *=
      49 /
      radius;

  }

  camera.position.copy(
    player
  );

  camera.rotation.order =
    "YXZ";

  camera.rotation.y =
    yaw;

  camera.rotation.x =
    pitch;

  currentInteractable =
    nearestInteractable();

  if(
    currentInteractable
  ){

    prompt.style.display =
      "block";

    promptTitle.textContent =
      currentInteractable
      .userData
      .label;

    promptSub.textContent =
      currentInteractable
      .userData
      .action;

  }else{

    prompt.style.display =
      "none";

  }

}


/* ========================================
   ANIMATION LOOP
======================================== */

const clock =
  new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );

  const dt =
    Math.min(
      clock.getDelta(),
      .04
    );

  for(
    const mixer
    of mixers
  ){

    mixer.update(
      dt
    );

  }

  if(
    !overview
  ){

    updatePlayer(
      dt
    );

  }

  const t =
    performance.now() *
    .0003;

  sea.material.color.setHSL(
    .53,
    .65,
    .34 +
    Math.sin(t) *
    .015
  );

  renderer.render(
    scene,
    camera
  );

}


animate();


/* ========================================
   FINISH LOADING
======================================== */

setTimeout(
  () => {

    document
      .getElementById(
        "loading"
      )
      .classList
      .add(
        "hidden"
      );

  },
  500
);


/* ========================================
   RESIZE
======================================== */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

</script>
