<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>The Children Kingdom</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#071522;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  font:inherit;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#071522;
}

#scene{
  position:absolute;
  inset:0;
}

#scene svg{
  width:100%;
  height:100%;
  display:block;
}

/* clickable zones */

.hotspot{
  position:absolute;
  border:0;
  background:transparent;
  cursor:pointer;
  z-index:20;
}

#castleBtn{
  left:34%;
  top:23%;
  width:32%;
  height:32%;
}

#barracksBtn{
  left:13%;
  top:37%;
  width:20%;
  height:18%;
}

#farmBtn{
  right:8%;
  top:41%;
  width:22%;
  height:17%;
}

#shipyardBtn{
  right:5%;
  bottom:14%;
  width:28%;
  height:22%;
}

#allianceBtn{
  left:2%;
  bottom:3%;
  width:18%;
  height:9%;
}

#heroesBtn{
  left:21%;
  bottom:3%;
  width:18%;
  height:9%;
}

#worldBtn{
  right:21%;
  bottom:3%;
  width:18%;
  height:9%;
}

#attackBtn{
  right:2%;
  bottom:3%;
  width:18%;
  height:9%;
}

/* popup */

#shade{
  display:none;
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(3px);
  z-index:50;
}

#shade.show{
  display:block;
}

#panel{
  position:absolute;
  left:50%;
  bottom:-650px;
  transform:translateX(-50%);
  width:min(600px,94vw);
  z-index:60;

  background:linear-gradient(#fff9e8,#e5c98f);
  border:2px solid #d5ad55;
  border-radius:24px 24px 0 0;

  box-shadow:0 -20px 60px rgba(0,0,0,.7);
  overflow:hidden;

  transition:.28s ease;
}

#panel.show{
  bottom:0;
}

#panelHeader{
  position:relative;
  background:linear-gradient(#345a77,#142d42);
  color:white;
  padding:16px 55px 13px 18px;
}

#panelTitle{
  font-size:22px;
  font-weight:900;
}

#panelSub{
  margin-top:4px;
  font-size:11px;
  color:#d4e0e8;
}

#closePanel{
  position:absolute;
  right:13px;
  top:12px;
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#0c1e2d;
  color:white;
  font-size:20px;
}

#panelBody{
  padding:16px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.card{
  background:rgba(255,255,255,.62);
  border:1px solid #c7a968;
  border-radius:13px;
  padding:11px;
}

.card small{
  display:block;
  font-size:10px;
  color:#7d6847;
}

.card strong{
  display:block;
  margin-top:3px;
  font-size:19px;
  color:#352819;
}

.action{
  width:100%;
  margin-top:10px;
  padding:13px;
  border-radius:12px;
  border:1px solid #efd27f;
  color:white;
  font-weight:900;

  background:linear-gradient(#dda73c,#8b5a16);
}

.blue{
  background:linear-gradient(#4b92ce,#28577e);
}

.red{
  background:linear-gradient(#dd665c,#8a302c);
}

.green{
  background:linear-gradient(#67b760,#347c3b);
}

/* world map */

#worldMap{
  display:none;
  position:absolute;
  inset:0;
  z-index:40;

  background:
    radial-gradient(circle at 45% 40%,#55b9d9,#0a5578 60%,#07354e);
}

#worldMap.show{
  display:block;
}

#backMap{
  position:absolute;
  left:15px;
  top:18px;
  width:48px;
  height:48px;

  border-radius:50%;
  border:2px solid #d4af5e;

  background:#16364e;
  color:white;
  font-size:24px;
}

#mapTitle{
  position:absolute;
  top:27px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  font-weight:900;
  font-size:21px;
}

.island{
  position:absolute;
  width:145px;
  min-height:90px;

  border-radius:22px;
  border:2px solid #d0aa5a;

  background:linear-gradient(#42758d,#16364b);

  color:white;
  padding:11px;

  box-shadow:0 12px 28px rgba(0,0,0,.4);
}

.island strong{
  display:block;
}

.island small{
  display:block;
  margin-top:6px;
  color:#e0cb95;
}

#homeIsland{
  left:6%;
  bottom:18%;
}

#redIsland{
  right:6%;
  top:18%;
}

#greenIsland{
  right:12%;
  bottom:14%;
}

#crownIsland{
  left:42%;
  top:31%;
}

#toast{
  position:absolute;
  z-index:100;
  left:50%;
  top:88px;

  transform:translateX(-50%) translateY(-150px);

  max-width:85%;
  padding:11px 17px;

  border-radius:13px;
  border:1px solid #d2ad5e;

  background:rgba(8,25,39,.97);
  color:white;
  text-align:center;
  font-weight:800;

  transition:.25s;
}

#toast.show{
  transform:translateX(-50%) translateY(0);
}

@media(max-width:700px){
  .island{
    width:118px;
    min-height:78px;
    font-size:11px;
  }
}
</style>

<script>

let state={

  gold:128600,
  wood:96400,
  food:72800,
  stone:54300,

  castle:15,
  soldiers:220,
  ships:3,

  barracks:12,
  farm:12,
  shipyard:13,

  guild:"Blue Crown Alliance"

};


const SAVE_KEY=
"TCK_SVG_V1";


const saved=
localStorage.getItem(
  SAVE_KEY
);


if(saved){

  try{

    state=
    Object.assign(
      state,
      JSON.parse(saved)
    );

  }catch(e){}

}


function $(id){

  return document.getElementById(id);

}


function save(){

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(state)
  );

}


function toast(text){

  $("toast").innerText=text;

  $("toast").classList.add("show");

  setTimeout(()=>{

    $("toast").classList.remove("show");

  },1600);

}


function openPanel(
  title,
  subtitle,
  html
){

  $("panelTitle").innerText=
  title;

  $("panelSub").innerText=
  subtitle;

  $("panelBody").innerHTML=
  html;

  $("shade").classList.add("show");

  $("panel").classList.add("show");

}


function closePanel(){

  $("shade").classList.remove("show");

  $("panel").classList.remove("show");

}


$("closePanel").onclick=
closePanel;


$("shade").onclick=
closePanel;


/* CASTLE */

$("castleBtn").onclick=()=>{

  openPanel(

  "Royal Castle",

  "Capital of The Children Kingdom",

  `

  <div class="grid">

  <div class="card">
  <small>Castle Level</small>
  <strong>${state.castle}</strong>
  </div>

  <div class="card">
  <small>Soldiers</small>
  <strong>${state.soldiers}</strong>
  </div>

  <div class="card">
  <small>Warships</small>
  <strong>${state.ships}</strong>
  </div>

  <div class="card">
  <small>Alliance</small>
  <strong>Blue Crown</strong>
  </div>

  </div>

  <button
  class="action green"
  onclick="upgradeCastle()">

  Upgrade Castle

  </button>

  `

  );

};


function upgradeCastle(){

  const cost=
  state.castle*
  12000;


  if(
    state.gold<
    cost
  ){

    toast(
      "Not enough gold"
    );

    return;

  }


  state.gold-=cost;

  state.castle++;

  save();

  closePanel();

  toast(
    "Castle upgraded to Lv."
    +state.castle
  );

}


/* BARRACKS */

$("barracksBtn").onclick=()=>{

  openPanel(

  "Barracks",

  "Train your army",

  `

  <div class="grid">

  <div class="card">
  <small>Barracks Level</small>
  <strong>${state.barracks}</strong>
  </div>

  <div class="card">
  <small>Soldiers</small>
  <strong>${state.soldiers}</strong>
  </div>

  </div>

  <button
  class="action red"
  onclick="trainArmy()">

  Train 20 Soldiers

  </button>

  `

  );

};


function trainArmy(){

  if(
    state.gold<8000 ||
    state.food<5000
  ){

    toast(
      "Not enough resources"
    );

    return;

  }


  state.gold-=8000;

  state.food-=5000;

  state.soldiers+=20;

  save();

  closePanel();

  toast(
    "20 soldiers trained"
  );

}


/* FARM */

$("farmBtn").onclick=()=>{

/* SHIPYARD */

$("shipyardBtn").onclick=()=>{

  openPanel(

  "Royal Shipyard",

  "Build fleets for overseas war",

  `

  <div class="grid">

  <div class="card">

  <small>Shipyard Level</small>

  <strong>${state.shipyard}</strong>

  </div>

  <div class="card">

  <small>Warships</small>

  <strong>${state.ships}</strong>

  </div>

  </div>

  <button
  class="action blue"
  onclick="buildShip()">

  Build Warship

  </button>

  `

  );

};


function buildShip(){

  if(
    state.gold<20000 ||
    state.wood<15000
  ){

    toast(
      "Not enough resources"
    );

    return;

  }


  state.gold-=20000;

  state.wood-=15000;

  state.ships++;

  save();

  closePanel();

  toast(
    "New warship launched"
  );

}

/* WORLD MAP */

function openWorld(){

  $("worldMap").classList.add("show");

  closePanel();

}

openWorld;


$("backMap").onclick=()=>{

  $("worldMap").classList.remove("show");

};


/* ENEMIES */

document
.querySelectorAll(".enemy")
.forEach(island=>{

  island.onclick=()=>{

    const name=
    island.dataset.name;

    const enemyPower=
    Number(
      island.dataset.power
    );

    const rallyPower=

    state.soldiers*20
    +
    state.ships*550
    +
    1200;


    let risk="EXTREME";


    if(
      rallyPower >
      enemyPower*1.4
    ){

      risk="LOW";

    }else if(
      rallyPower >=
      enemyPower
    ){

      risk="MEDIUM";

    }else if(
      rallyPower >=
      enemyPower*.7
    ){

      risk="HIGH";

    }


    openPanel(

    name,

    "Enemy Kingdom",

    `

    <div class="grid">

    <div class="card">

    <small>Enemy Power</small>

    <strong>${enemyPower}</strong>

    </div>

    <div class="card">

    <small>Rally Power</small>

    <strong>${rallyPower}</strong>

    </div>

    <div class="card">

    <small>Risk</small>

    <strong>${risk}</strong>

    </div>

    <div class="card">

    <small>Warships</small>

    <strong>${state.ships}</strong>

    </div>

    </div>

    <button
    class="action red"
    onclick="
    attackEnemy(
      '${name}',
      ${enemyPower}
    )
    ">

    Alliance Rally Attack

    </button>

    `

    );

  };

});


function attackEnemy(
  name,
  enemyPower
){

  if(
    state.ships<1
  ){

    toast(
      "Build a warship first"
    );

    return;

  }


  const power=

  state.soldiers*20
  +
  state.ships*550
  +
  1200;


  const win=

  Math.random()
  <
  power/
  (
    power+
    enemyPower
  );


  closePanel();


  if(win){

    state.gold+=15000;

    state.wood+=8000;

    state.soldiers=

    Math.max(
      0,
      state.soldiers-
      Math.floor(
        state.soldiers*.08
      )
    );


    save();


    toast(
      "VICTORY — "
      +name+
      " defeated"
    );

  }else{

    state.gold=

    Math.floor(
      state.gold*.85
    );


    state.soldiers=

    Math.max(
      0,
      state.soldiers-
      Math.floor(
        state.soldiers*.25
      )
    );


    save();


    toast(
      "DEFEAT — rebuild your kingdom"
    );

  }

}


toast(
  "The Children Kingdom loaded"
);

</script>
